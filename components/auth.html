<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up - Jadoo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Open+Sans:wght@400;600&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400&family=Volkhov:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../styles/auth.css">
    <link rel="stylesheet" href="../styles/dark-theme.css">
    <!-- Early dark theme execution to prevent light-theme flash -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('jadoo_dark_theme');
                if (saved === null) {
                    var match = document.cookie.match(/(?:^|; )jadoo_dark_theme=([^;]*)/);
                    if (match) {
                        try { saved = JSON.parse(decodeURIComponent(match[1])); } catch (e) { saved = match[1]; }
                    }
                }
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var isDark = saved !== null ? (saved === 'true' || saved === true) : prefersDark;
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <!-- Dynamic Ambient Lighting Blobs -->
    <div class="auth-ambient-blobs" aria-hidden="true">
        <div class="ambient-blob blob-coral"></div>
        <div class="ambient-blob blob-gold"></div>
        <div class="ambient-blob blob-purple"></div>
    </div>

    <!-- Back to Home Button -->
    <a href="../index.html" class="back-home-btn" title="Back to Homepage">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to Home</span>
    </a>

    <div class="container">
        <section class="login" id="loginCard">
            <!-- Dynamic Authentication Status Banner -->
            <div id="authStatusBanner" class="auth-status-banner" style="display: none;"></div>

            <!-- Top Slider Toggle -->
            <div class="toggle" id="togglePill">
                <div class="toggler"></div>
                <button type="button" class="sign-in" id="signin"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In</button>
                <button type="button" class="sign-up" id="signup"><i class="fa-solid fa-user-plus"></i> Sign Up</button>
            </div>

            <!-- Animated Flying Airplane -->
            <div class="login-plane">
                <img src="../assets/login-airplane.png" alt="Airplane">
            </div>

            <!-- Dual Panel Container -->
            <div class="login-image">
                <!-- Sliding Visual Girl Panel (Starts on Left, slides Right on Sign Up) -->
                <div class="login-girl">
                    <img src="../assets/login-girl.png" alt="Traveler" class="girl-img">
                    <!-- Floating Interactive Travel Badges -->
                    <div class="floating-travel-chip chip-globe">
                        <div class="chip-icon-box"><i class="fa-solid fa-earth-americas"></i></div>
                        <div class="chip-info">
                            <strong>130,000+</strong>
                            <span>Global Cities</span>
                        </div>
                    </div>
                    <div class="floating-travel-chip chip-rating">
                        <div class="chip-icon-box star-box"><i class="fa-solid fa-star"></i></div>
                        <div class="chip-info">
                            <strong>4.9 / 5.0</strong>
                            <span>Verified Trips</span>
                        </div>
                    </div>
                </div>

                <!-- Sign Up Form (On Left Side: Hidden by default, shown on Sign Up) -->
                <div class="login-form signup-form">
                    <form action="" class="form" id="signupForm" onsubmit="event.preventDefault();" novalidate>
                        <label class="label">Sign Up</label>
                        <div class="input-fields">
                            <div class="input-group">
                                <div class="input-with-icon">
                                    <i class="fa-regular fa-user field-icon"></i>
                                    <input type="text" id="signup-fullname" placeholder="Full Name" required autocomplete="name">
                                </div>
                                <span class="field-error-msg" id="signup-fullname-error"></span>
                            </div>
                            <div class="input-group">
                                <div class="input-with-icon">
                                    <i class="fa-regular fa-envelope field-icon"></i>
                                    <input type="email" id="signup-email" placeholder="Email Address" required autocomplete="email">
                                </div>
                                <span class="field-error-msg" id="signup-email-error"></span>
                            </div>
                            <div class="input-group">
                                <div class="password-input-wrapper input-with-icon">
                                    <i class="fa-solid fa-lock field-icon"></i>
                                    <input type="password" id="signup-password" placeholder="Create Password" required autocomplete="new-password">
                                    <button type="button" class="toggle-password-btn" id="toggle-signup-password" data-target="signup-password" aria-label="Show password" title="Show password">
                                        <i class="fa-regular fa-eye"></i>
                                    </button>
                                </div>
                                <div class="password-strength-meter" id="signup-password-strength" style="display: none;">
                                    <div class="strength-bars">
                                        <div class="strength-segment"></div>
                                        <div class="strength-segment"></div>
                                        <div class="strength-segment"></div>
                                        <div class="strength-segment"></div>
                                    </div>
                                    <span class="strength-label" id="signup-password-strength-label">Password strength: Weak</span>
                                </div>
                                <span class="field-error-msg" id="signup-password-error"></span>
                            </div>
                        </div>
                        <div class="input-buttons">
                            <button type="submit" id="signup-submit-btn" class="login-btn">
                                <span>Sign Up</span>
                                <i class="fa-solid fa-arrow-right btn-arrow"></i>
                            </button>
                            <div class="secondary-actions">
                                <span>Already have an account?</span>
                                <a href="#" class="switch-to-signin">Sign In</a>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Sign In Form (On Right Side: Shown by default, hidden on Sign Up) -->
                <div class="login-form signin-form">
                    <form action="" class="form" id="signinForm" onsubmit="event.preventDefault();" novalidate>
                        <label class="label" id="signinLabel">Login</label>
                        <!-- Container for Remembered Account Notification -->
                        <div id="rememberedAccountPrompt" class="remembered-account-prompt-wrap" style="display: none; width: 100%;"></div>
                        <div class="input-fields" id="signinInputFields">
                            <div class="input-group" id="userIdGroup">
                                <div class="input-with-icon">
                                    <i class="fa-regular fa-envelope field-icon"></i>
                                    <input type="text" id="user-id" placeholder="Your ID or Email" required autocomplete="username">
                                </div>
                                <span class="field-error-msg" id="user-id-error"></span>
                            </div>
                            <div class="input-group" id="signinPasswordGroup">
                                <div class="password-input-wrapper input-with-icon">
                                    <i class="fa-solid fa-lock field-icon"></i>
                                    <input type="password" id="signin-password" placeholder="Password" required autocomplete="current-password">
                                    <button type="button" class="toggle-password-btn" id="toggle-signin-password" data-target="signin-password" aria-label="Show password" title="Show password">
                                        <i class="fa-regular fa-eye"></i>
                                    </button>
                                </div>
                                <span class="field-error-msg" id="signin-password-error"></span>
                            </div>
                        </div>
                        <div class="input-buttons">
                            <button type="submit" id="signin-submit-btn" class="login-btn">
                                <span id="signinBtnText">Login</span>
                                <i class="fa-solid fa-arrow-right btn-arrow"></i>
                            </button>
                            <div class="secondary-actions">
                                <a href="#" class="forget-btn">Forgot Password?</a>
                                <span class="divider-dot">•</span>
                                <a href="#" class="switch-to-signup">Sign Up</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <script>
        const card = document.getElementById('loginCard');
        const toggle = document.getElementById('togglePill');
        const signinBtn = document.getElementById('signin');
        const signupBtn = document.getElementById('signup');
        const switchToSignupLinks = document.querySelectorAll('.switch-to-signup');
        const switchToSigninLinks = document.querySelectorAll('.switch-to-signin');

        function activateSignUp() {
            if (toggle) toggle.classList.add('signup-active');
            if (card) card.classList.add('signup-active');
        }

        function activateSignIn() {
            if (toggle) toggle.classList.remove('signup-active');
            if (card) card.classList.remove('signup-active');
        }

        if (signupBtn) signupBtn.addEventListener('click', activateSignUp);
        if (signinBtn) signinBtn.addEventListener('click', activateSignIn);

        switchToSignupLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                activateSignUp();
            });
        });

        switchToSigninLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                activateSignIn();
            });
        });

        function checkHash() {
            if (window.location.hash === '#signup') {
                activateSignUp();
            } else if (window.location.hash === '#signin') {
                activateSignIn();
            }
        }
        // Check on initial load and when hash changes
        window.addEventListener('DOMContentLoaded', checkHash);
        window.addEventListener('hashchange', checkHash);
        checkHash();
    </script>
    <!-- Dark Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>
    <!-- Validation & Core Scripts -->
    <script src="../scripts/auth.js"></script>
    <script type="module" src="../scripts/db.js"></script>
    <script type="module" src="../scripts/features.js"></script>
    <script src="../scripts/script.js"></script>
</body>

</html>
