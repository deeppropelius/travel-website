<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181E4B" />
      <stop offset="100%" stop-color="#2D325A" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF946D" />
      <stop offset="100%" stop-color="#DF6951" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1A501" />
      <stop offset="100%" stop-color="#DF6951" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#DF6951" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#DF6951" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Decorative flight path curve -->
  <path d="M12 48 C 20 48, 30 42, 44 26" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Jet plane symbol -->
  <g filter="url(#glow)">
    <path d="M48 16 L24 32 L32 35 L48 16 Z" fill="url(#planeGrad)" />
    <path d="M48 16 L32 35 L33 46 L38 39 L48 16 Z" fill="#C5523B" />
    <path d="M48 16 L16 28 L24 32 L48 16 Z" fill="#FFA585" />
    <!-- Wing fold highlight -->
    <polygon points="32,35 38,39 34,44" fill="#F1A501" />
  </g>
</svg>
